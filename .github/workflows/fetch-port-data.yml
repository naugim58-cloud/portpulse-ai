name: Fetch Busan vessel operations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved public-data API
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen
          from xml.etree import ElementTree as ET

          now = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9)))
          start = now.strftime('%Y%m%d')
          end = (now + timedelta(days=1)).strftime('%Y%m%d')
          key = os.environ.get('DATA_GO_KR_SERVICE_KEY', '').strip()
          result = {'updatedAt': now.isoformat(timespec='seconds'), 'source': '해양수산부_선박운항정보', 'endpoint': 'https://apis.data.go.kr/1192000/VsslEtrynd5/Info5', 'records': [], 'weather': {}, 'weatherSource': '기상청 해양기상정보 기준 · Open-Meteo Marine 실시간 관측/예보', 'weatherEndpoint': 'https://marine-api.open-meteo.com/v1/marine'}

          if key:
              params = 'serviceKey=' + quote(key, safe='%') + '&pageNo=1&numOfRows=50&prtAgCd=020&sde=' + start + '&ede=' + end + '&deGb=I'
              try:
                  with urlopen('https://apis.data.go.kr/1192000/VsslEtrynd5/Info5?' + params, timeout=30) as response:
                      root = ET.fromstring(response.read())
                  for item in root.findall('.//item'):
                      def val(name):
                          node = item.find(name)
                          return (node.text or '').strip() if node is not None else ''
                      result['records'].append({'portName': val('prtAgNm'), 'vesselName': val('vsslNm'), 'callSign': val('clsgn'), 'entryType': val('etryndNm'), 'entryAt': val('etryptDt'), 'departureAt': val('tkoffDt'), 'departurePort': val('prvsDpmprtPrtNm'), 'nextPort': val('nxlnptPrtNm'), 'destinationPort': val('dstnPrtNm'), 'expectedDepartureAt': val('tkoffPrrrnDt'), 'expectedDestinationEntryAt': val('dstnEtryptDt')})
              except Exception as exc:
                  result['error'] = str(exc)
          else:
              result['error'] = 'DATA_GO_KR_SERVICE_KEY secret is not configured'

          # 부산항 각 권역의 해상 상태를 15분마다 함께 갱신합니다.
          # 기상청 해양기상정보 화면에서 제공하는 핵심 항목(풍향·풍속·파고·파주기)에 맞춰 저장합니다.
          ports = {
              '부산신항': (35.05, 128.83), '북항': (35.11, 129.04),
              '감천항': (35.05, 129.01), '다대포항': (35.04, 128.97),
              '남항': (35.08, 129.03), '영도 크루즈터미널': (35.08, 129.07)
          }
          def direction(deg):
              names = ['북','북동','동','남동','남','남서','서','북서']
              return names[int(((float(deg) + 22.5) % 360) // 45)] if deg is not None else '미상'
          for port, (lat, lon) in ports.items():
              try:
                  marine_url = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + str(lat) + '&longitude=' + str(lon) + '&current=wave_height,wave_direction,wave_period,swell_wave_height&hourly=wave_height,wave_direction,wave_period&forecast_days=2&timezone=Asia%2FSeoul'
                  weather_url = 'https://api.open-meteo.com/v1/forecast?latitude=' + str(lat) + '&longitude=' + str(lon) + '&current=wind_speed_10m,wind_direction_10m,temperature_2m&timezone=Asia%2FSeoul'
                  with urlopen(marine_url, timeout=30) as response:
                      marine = json.loads(response.read().decode('utf-8'))
                  with urlopen(weather_url, timeout=30) as response:
                      surface = json.loads(response.read().decode('utf-8'))
                  cur = marine.get('current', {})
                  wind = surface.get('current', {})
                  hourly = marine.get('hourly', {})
                  result['weather'][port] = {
                      'latitude': lat, 'longitude': lon, 'observedAt': cur.get('time') or wind.get('time'),
                      'windDirection': direction(wind.get('wind_direction_10m')), 'windDirectionDeg': wind.get('wind_direction_10m'),
                      'windSpeedKn': round(float(wind.get('wind_speed_10m', 0)) * 0.539957, 1),
                      'temperatureC': wind.get('temperature_2m'), 'waveHeightM': cur.get('wave_height'),
                      'waveDirectionDeg': cur.get('wave_direction'), 'wavePeriodS': cur.get('wave_period'),
                      'swellHeightM': cur.get('swell_wave_height'),
                      'forecast': [{'time': t, 'waveHeightM': h, 'wavePeriodS': p} for t, h, p in zip(hourly.get('time', [])[:24], hourly.get('wave_height', [])[:24], hourly.get('wave_period', [])[:24])]
                  }
              except Exception as exc:
                  result['weather'][port] = {'error': str(exc)}

          Path('assets/live-vessel-data.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-vessel-data.json
          git diff --cached --quiet || git commit -m "chore: refresh vessel operations data"
          git push
