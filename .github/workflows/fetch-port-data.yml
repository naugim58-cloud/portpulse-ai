name: Fetch Busan vessel operations

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved public-data API
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOMSA_REALTIME_SERVICE_KEY: ${{ secrets.KOMSA_REALTIME_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen
          from xml.etree import ElementTree as ET

          now = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9)))
          start = now.strftime('%Y%m%d')
          end = (now + timedelta(days=1)).strftime('%Y%m%d')
          key = os.environ.get('DATA_GO_KR_SERVICE_KEY', '').strip()
          result = {'updatedAt': now.isoformat(timespec='seconds'), 'source': '해양수산부_선박운항정보', 'endpoint': 'https://apis.data.go.kr/1192000/VsslEtrynd5/Info5', 'records': [], 'traffic': {'source': '한국해양교통안전공단_실시간 교통정보', 'endpoint': 'https://apis.data.go.kr/B554035/realtime/get_realtime', 'updatedAt': now.isoformat(timespec='seconds'), 'records': []}}

          if key:
              params = 'serviceKey=' + quote(key, safe='%') + '&pageNo=1&numOfRows=50&prtAgCd=020&sde=' + start + '&ede=' + end + '&deGb=I'
              try:
                  with urlopen('https://apis.data.go.kr/1192000/VsslEtrynd5/Info5?' + params, timeout=30) as response:
                      root = ET.fromstring(response.read())
                  for item in root.findall('.//item'):
                      def val(name):
                          node = item.find(name)
                          return (node.text or '').strip() if node is not None else ''
                      result['records'].append({'portName': val('prtAgNm'), 'vesselName': val('vsslNm'), 'callSign': val('clsgn'), 'entryType': val('etryndNm'), 'entryAt': val('etryptDt'), 'departureAt': val('tkoffDt'), 'departurePort': val('prvsDpmprtPrtNm'), 'nextPort': val('nxlnptPrtNm'), 'destinationPort': val('dstnPrtNm'), 'expectedDepartureAt': val('tkoffPrrrnDt'), 'expectedDestinationEntryAt': val('dstnEtryptDt')})
              except Exception as exc:
                  result['error'] = str(exc)
          else:
              result['error'] = 'DATA_GO_KR_SERVICE_KEY secret is not configured'

          # MTIS 실시간 해양교통정보(5분 단위)를 혼잡도 보정용으로 수집합니다.
          traffic_key = os.environ.get('KOMSA_REALTIME_SERVICE_KEY', '').strip()
          if traffic_key:
              traffic_params = 'serviceKey=' + quote(traffic_key, safe='%') + '&pageNo=1&numOfRows=500&dataType=JSON'
              try:
                  with urlopen('https://apis.data.go.kr/B554035/realtime/get_realtime?' + traffic_params, timeout=30) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  body = payload.get('response', {}).get('body', payload.get('body', payload)) if isinstance(payload, dict) else {}
                  def as_items(value):
                      if isinstance(value, list): return value
                      if isinstance(value, dict):
                          for key_name in ('items', 'item', 'data', 'rows', 'records', 'result'):
                              if key_name in value:
                                  found = as_items(value[key_name])
                                  if found: return found
                          if any(k in value for k in ('density', 'vesselCount', 'shipCount', 'cnt', '선박척수', '밀집도')): return [value]
                      return []
                  def pick(item, names):
                      for name in names:
                          if name in item and item[name] not in (None, ''): return item[name]
                      return None
                  normalized = []
                  for item in as_items(body):
                      if not isinstance(item, dict): continue
                      normalized.append({'latitude': pick(item, ('lat','latitude','위도','y')), 'longitude': pick(item, ('lon','lng','longitude','경도','x')), 'vesselCount': pick(item, ('vesselCount','shipCount','shipCnt','vsslCnt','cnt','선박척수','선박수')), 'density': pick(item, ('density','trafficDensity','congestion','밀집도','혼잡도')), 'gridLevel': pick(item, ('gridLevel','level','격자단계')), 'observedAt': pick(item, ('observedAt','baseDateTime','dateTime','일시','시간'))})
                  result['traffic']['records'] = normalized
                  result['traffic']['recordCount'] = len(normalized)
                  result['traffic']['rawStatus'] = payload.get('response', {}).get('header', {}).get('resultCode', '') if isinstance(payload, dict) else ''
              except Exception as exc:
                  result['traffic']['error'] = str(exc)
          else:
              result['traffic']['error'] = 'KOMSA_REALTIME_SERVICE_KEY secret is not configured'

          # 부산항 권역의 해상 기상도 같은 스냅샷에 저장합니다.
          result['weather'] = {}
          result['weatherSource'] = 'Open-Meteo Marine 실시간 관측/예보'
          for port, (lat, lon) in {'부산신항': (35.05,128.83), '북항': (35.11,129.04), '감천항': (35.05,129.01), '다대포항': (35.04,128.97), '남항': (35.08,129.03), '영도 크루즈터미널': (35.08,129.07)}.items():
              try:
                  marine_url = f'https://marine-api.open-meteo.com/v1/marine?latitude={lat}&longitude={lon}&current=wave_height,wave_direction,wave_period,swell_wave_height&hourly=wave_height,wave_period&forecast_days=2&timezone=Asia%2FSeoul'
                  weather_url = f'https://api.open-meteo.com/v1/forecast?latitude={lat}&longitude={lon}&current=wind_speed_10m,wind_direction_10m,temperature_2m&timezone=Asia%2FSeoul'
                  with urlopen(marine_url, timeout=30) as response: marine = json.loads(response.read().decode('utf-8'))
                  with urlopen(weather_url, timeout=30) as response: surface = json.loads(response.read().decode('utf-8'))
                  cur, wind = marine.get('current', {}), surface.get('current', {})
                  result['weather'][port] = {'latitude':lat,'longitude':lon,'observedAt':cur.get('time') or wind.get('time'),'windSpeedKn':round(float(wind.get('wind_speed_10m',0))*0.539957,1),'windDirectionDeg':wind.get('wind_direction_10m'),'temperatureC':wind.get('temperature_2m'),'waveHeightM':cur.get('wave_height'),'waveDirectionDeg':cur.get('wave_direction'),'wavePeriodS':cur.get('wave_period'),'swellHeightM':cur.get('swell_wave_height')}
              except Exception as exc:
                  result['weather'][port] = {'error': str(exc)}

          Path('assets/live-vessel-data.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-vessel-data.json
          git diff --cached --quiet || git commit -m "chore: refresh vessel operations data"
          git push
